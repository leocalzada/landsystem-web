name: Render Quarto Site with Plumber

on:
  push:
    branches:
      - main  # Or your default branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repository
      uses: actions/checkout@v3

    - name: Set up R
      uses: r-lib/actions/setup-r@v2

    - name: Install Quarto
      run: |
        wget https://quarto.org/download/latest/quarto-linux-amd64.deb
        sudo dpkg -i quarto-linux-amd64.deb
        quarto check install

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libsodium-dev libpng-dev
        sudo ldconfig

    - name: Install R Packages
      run: |
        R -e 'install.packages(c("plumber", "quarto", "leaflet", "rmarkdown", "sessioninfo", "renv", "here", "knitr", "RefManageR", "stringr", "yaml"), repos="https://cloud.r-project.org")'

    - name: Render Quarto Website
      run: |
        quarto render

    - name: Commit Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add _site/
        git commit -m "Automated render by GitHub Actions" || echo "No changes to commit"
        git push
